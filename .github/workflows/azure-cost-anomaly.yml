name: Azure cost anomaly investigation

on:
  pull_request:
    paths:
      - 'labs/azure-cost-anomaly/**'
      - '.github/workflows/azure-cost-anomaly.yml'
  push:
    branches: [main]
    paths:
      - 'labs/azure-cost-anomaly/**'
      - '.github/workflows/azure-cost-anomaly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    name: Verify cost detection and attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: labs/azure-cost-anomaly
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test data integrity, thresholds, and cost attribution
        run: python -m unittest -v
      - name: Reproduce the steady day and the spike
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cost-reports"
          python cost_watch.py examples/manifest.json --day 2026-11-16 \
            --summary "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/cost-reports/steady.json"
          status=0
          python cost_watch.py examples/manifest.json --day 2026-11-17 \
            --summary "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/cost-reports/spike.json" || status=$?
          if [[ "$status" -ne 1 ]]; then
            echo "Expected the spike to exit 1, got $status" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/cost-reports/steady.json" "$RUNNER_TEMP/cost-reports/spike.json"
      - name: Save both JSON reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-cost-reports
          path: ${{ runner.temp }}/cost-reports/*.json
          if-no-files-found: error
          retention-days: 14
