name: PostgreSQL backup and restore

on:
  push:
    paths:
      - 'labs/postgres-recovery/**'
      - '.github/workflows/postgres-recovery.yml'
  pull_request:
    paths:
      - 'labs/postgres-recovery/**'
      - '.github/workflows/postgres-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Restore and verify the backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the lab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pull PostgreSQL 17
        run: docker pull postgres:17-bookworm
      - name: Run the isolated recovery drill
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --pull=never --network none --user postgres \
            --entrypoint bash postgres:17-bookworm -s \
            < labs/postgres-recovery/drill.sh | tee "$RUNNER_TEMP/recovery.md"
          cat "$RUNNER_TEMP/recovery.md" >> "$GITHUB_STEP_SUMMARY"
