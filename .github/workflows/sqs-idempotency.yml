name: SQS worker replay and dead-letter checks

on:
  push:
    paths:
      - 'labs/sqs-idempotent-worker/**'
      - '.github/workflows/sqs-idempotency.yml'
  pull_request:
    paths:
      - 'labs/sqs-idempotent-worker/**'
      - '.github/workflows/sqs-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Verify concurrent writes, crash recovery, and redrive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/sqs-idempotent-worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the AWS SDK
        run: python -m pip install -r requirements.txt
      - name: Test acknowledgement and failure handling
        run: python -m unittest -v test_worker
      - name: Start the queue and database
        run: docker compose up -d
      - name: Run recovery scenarios
        shell: bash
        run: |
          set -euo pipefail
          python drill.py | tee "$RUNNER_TEMP/sqs-drill.md"
          cat "$RUNNER_TEMP/sqs-drill.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Remove the lab containers
        if: always()
        run: docker compose down -v
