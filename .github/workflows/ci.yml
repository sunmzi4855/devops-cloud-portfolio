name: CI - Python tests and Docker smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: |
          docker build --iidfile "$RUNNER_TEMP/tested-image.id" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t cloud-devops-demo:ci .
      - name: Verify container health endpoint
        run: |
          docker run -d --name demo -p 127.0.0.1:8080:8080 "$(cat "$RUNNER_TEMP/tested-image.id")"
          trap 'docker logs demo; docker rm -f demo' EXIT
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/health | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "healthy"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - name: Generate and verify the tested image's SBOM
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          bash security/image-sbom.sh "$(cat "$RUNNER_TEMP/tested-image.id")" "$RUNNER_TEMP/image-sbom"
          {
            echo '### Tested image inventory'
            echo '~~~text'
            cat "$RUNNER_TEMP/image-sbom/build-info.txt"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-sbom/
          if-no-files-found: error
          retention-days: 30
